<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="./dist/assets/images/logo.ico"
      type="image/x-icon"
    />
    <title>Sanity Destroyed</title>

    <!-- Estilos -->
    <link rel="stylesheet" href="./dist/css/styles.css" />
  </head>
  <body>
    <div class="background-home">
      <header class="container col-12 h-25 p-3">
        <nav>
          <!-- Navegação para Dispositivos Grandes -->
          <div
            class="d-none d-lg-flex justify-content-around align-items-center"
          >
            <a class="link" href="/agenda">Agenda</a>
            <a class="link" href="/banda">Banda</a>
            <a class="link" href="/musicas">Músicas</a>
            <a href="/">
              <img src="./dist/assets/images/logo.png" alt="logo" />
            </a>
            <a class="link" href="/novidades">Novidades</a>
            <a class="link" href="/midias">Mídias</a>
            <a class="link" href="/loja">Loja</a>
          </div>

          <!-- Ícone do menu como Dropdown (Móvel) -->
          <div class="d-lg-none position-relative">
            <!-- Logo Centralizada (Móvel) -->
            <div class="text-center mb-3">
              <a href="/">
                <img
                  src="./dist/assets/images/logo.png"
                  alt="logo"
                  class="w-25 img-fluid"
                />
              </a>
            </div>

            <!-- Botão Dropdown -->
            <div class="dropdown position-absolute top-0 end-0 m-3">
              <button
                class="btn border-0"
                type="button"
                id="dropdownMenuButton"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                <img
                  class="img-fluid dropdown-icon"
                  style="width: 2rem"
                  src="./dist/assets/icons/menu.svg"
                  alt="menu"
                />
              </button>
              <ul
                class="dropdown-menu text-center"
                aria-labelledby="dropdownMenuButton"
              >
                <li>
                  <a class="dropdown-item" href="/agenda">Agenda</a>
                </li>
                <li><a class="dropdown-item" href="/banda">Banda</a></li>
                <li><a class="dropdown-item" href="/musicas">Músicas</a></li>
                <li>
                  <a class="dropdown-item" href="/novidades">Novidades</a>
                </li>
                <li><a class="dropdown-item" href="/midia">Mídias</a></li>
                <li><a class="dropdown-item" href="/loja">Loja</a></li>
              </ul>
            </div>
          </div>
        </nav>
      </header>

      <!-- Seção Agenda -->
      <div class="px-2 py-5 h-75 w-100">
        <div
          class="container-lg container-fluid bg-dark text-light h-100 rounded-5 p-4"
        >
          <h2 class="text-center mb-4">Agenda</h2>
          <div
            id="eventCarousel"
            class="carousel slide pointer-event"
            data-bs-ride="carousel"
            style="min-height: 684px"
          >
            <div id="event-list" class="carousel-inner"></div>
            <!-- Controles do Carrossel -->
            <button
              class="carousel-control-prev"
              type="button"
              data-bs-target="#eventCarousel"
              data-bs-slide="prev"
            >
              <span
                class="carousel-control-prev-icon"
                aria-hidden="true"
              ></span>
              <span class="visually-hidden">Anterior</span>
            </button>
            <button
              class="carousel-control-next"
              type="button"
              data-bs-target="#eventCarousel"
              data-bs-slide="next"
            >
              <span
                class="carousel-control-next-icon"
                aria-hidden="true"
              ></span>
              <span class="visually-hidden">Próximo</span>
            </button>
          </div>
        </div>
      </div>
    </div>
    <main>
      <!-- Seção Notícias -->
      <section
        class="container h-100 d-flex flex-column align-items-start justify-content-center"
      >
        <h1 class="text-dark fw-bold mb-4">Notícias</h1>
        <div id="new-list" class="row"></div>
      </section>

      <!-- Seção Loja -->
      <section class="store h-100 d-flex align-items-center">
        <div class="container">
          <div
            class="d-flex justify-content-center align-items-start h-100 flex-column"
          >
            <!-- cabeçalho da seção loja -->
            <header class="d-flex justify-content-between align-items-center w-100 mt-4 px-3">
              <h1 class="my-5 text-dark fw-bold flex-grow-1">LOJA</h1>
              
              <button class="p-1 border border-4 border-dark rounded-3 position-relative mx-2" type="button" data-bs-toggle="modal" data-bs-target="#staticBackdrop">
                <img src="dist/assets/icons/cart.svg" alt="carrinho de compras" class="cart">
                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                  99+
                  <span class="visually-hidden">Itens no carrinho</span>
                </span>
              </button>
            </header>
          
            <!-- Modal -->
            <div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" data-bs-focus="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
              <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">

                  <div class="modal-header pb-0">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                  </div>

                  <div class="modal-body pt-0">
                    <!-- fiv card -->
                    <div class="d-flex justify-content-center">
                      <!-- card -->
                      <div class="col-6 col-md-4 col-lg-3 mb-2">
                        <div class="position-relative">
                          <!-- Imagem de fundo -->
                          <img src="../dist/assets/images/fundoItens.png" alt="Fundo" class="img-fluid w-100">
                          
                          <!-- Retângulo branco com a imagem do produto -->
                          <div class="position-absolute top-0 start-50 translate-middle-x white-background">
                            <div class="bg-white rounded-3 p-3 shadow-sm">
                              <img src="../dist/assets/images/produto.png" alt="Produto" class="img-fluid mx-auto d-block">
                            </div>
                          </div>
                                  
                          <!-- Informações do produto -->
                          <div class="position-absolute start-50 translate-middle-x info-product">
                            <h5 class="fw-bold text-light font-name-product mb-sm-2">CAMISETA SANITY</h5>
                            <div class="d-flex gap-1 font-discount">
                              <p class="card-text fw-semibold text-light bg-primary px-1 px-sm-3 rounded-1 ">DESCONTO 50% OFF</p>
                              <p class="text-light">DE <span class="text-decoration-line-through"><span class="fw-bold text-primary">R$</span class="fst-normal"> 80,00</span></p>
                            </div>
                            <p class="fw-bold fs-4 text-light"><span class="fs-6 text-primary">R$</span> 40,00</p>
                          </div>
                        </div>
                      </div>
                    </div>

                    <!-- div info -->
                    <div>
                      <p>Seu carrinho está vazio. Adicione itens para continuar.</p>
                    </div> 
                  </div>
                  
                  <div class="modal-footer">
                    <button type="button" class="btn btn-success">Finalizar Compra</button>
                  </div>
                </div>
              </div>
            </div>
              
            <div
              id="storeCarousel"
              class="carousel slide w-100"
              data-bs-ride="carousel"
            >
              <div id="product-list" class="carousel-inner p-5"></div>
              <button
                class="carousel-control-prev"
                type="button"
                data-bs-target="#storeCarousel"
                data-bs-slide="prev"
              >
                <span
                  class="carousel-control-prev-icon"
                  aria-hidden="true"
                ></span>
                <span class="visually-hidden">Anterior</span>
              </button>
              <button
                class="carousel-control-next"
                type="button"
                data-bs-target="#storeCarousel"
                data-bs-slide="next"
              >
                <span
                  class="carousel-control-next-icon"
                  aria-hidden="true"
                ></span>
                <span class="visually-hidden">Próximo</span>
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Rodapé -->
    <footer class="py-4 text-center">
      <div class="d-flex justify-content-center mb-3">
        <a href="#" class="mx-2">
          <img
            src="./dist/assets/icons/facebook-footer.svg"
            alt="Facebook Icon"
          />
        </a>
        <a href="#" class="mx-2">
          <img
            src="./dist/assets/icons/headphones-footer.svg"
            alt="Headphones Icon"
          />
        </a>
        <a href="#" class="mx-2">
          <img
            src="./dist/assets/icons/instagram-footer.svg"
            alt="Instagram Icon"
          />
        </a>
        <a href="#" class="mx-2">
          <img
            src="./dist/assets/icons/youtube-footer.svg"
            alt="YouTube Icon"
          />
        </a>
      </div>
      <p>Fourminds Tech ©</p>
    </footer>
    <script src="/bootstrap/js/bootstrap.bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/dist/js/home/index.js"></script>
  </body>
</html>
