<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="./dist/assets/images/logo.ico"
      type="image/x-icon"
    />
    <title>Sanity Destroyed</title>

    <!-- Estilos -->
    <link rel="stylesheet" href="./dist/css/styles.css" />
  </head>
  <body>
    <div class="background-home">
      <header class="container col-12 h-25 p-3">
        <nav>
          <!-- Navegação para Dispositivos Grandes -->
          <div
            class="d-none d-lg-flex justify-content-around align-items-center"
          >
            <a class="link" href="/agenda">Agenda</a>
            <a class="link" href="/banda">Banda</a>
            <a class="link" href="/musicas">Músicas</a>
            <a href="/">
              <img src="./dist/assets/images/logo.png" alt="logo" />
            </a>
            <a class="link" href="/novidades">Novidades</a>
            <a class="link" href="/midias">Mídias</a>
            <a class="link" href="/loja">Loja</a>
          </div>

          <!-- Ícone do menu como Dropdown (Móvel) -->
          <div class="d-lg-none position-relative">
            <!-- Logo Centralizada (Móvel) -->
            <div class="text-center mb-3">
              <a href="/">
                <img
                  src="./dist/assets/images/logo.png"
                  alt="logo"
                  class="w-25 img-fluid"
                />
              </a>
            </div>

            <!-- Botão Dropdown -->
            <div class="dropdown position-absolute top-0 end-0 m-3">
              <button
                class="btn border-0"
                type="button"
                id="dropdownMenuButton"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                <img
                  class="img-fluid dropdown-icon"
                  style="width: 2rem"
                  src="./dist/assets/icons/menu.svg"
                  alt="menu"
                />
              </button>
              <ul
                class="dropdown-menu text-center"
                aria-labelledby="dropdownMenuButton"
              >
                <li>
                  <a class="dropdown-item" href="/agenda">Agenda</a>
                </li>
                <li><a class="dropdown-item" href="/banda">Banda</a></li>
                <li><a class="dropdown-item" href="/musicas">Músicas</a></li>
                <li>
                  <a class="dropdown-item" href="/novidades">Novidades</a>
                </li>
                <li><a class="dropdown-item" href="/midia">Mídias</a></li>
                <li><a class="dropdown-item" href="/loja">Loja</a></li>
              </ul>
            </div>
          </div>
        </nav>
      </header>

      <!-- Seção Agenda -->
      <div class="px-2 py-5 h-75 w-100">
        <div
          class="container-lg container-fluid bg-dark text-light h-100 rounded-5 p-4"
        >
          <h2 class="text-center mb-4">Agenda</h2>
          <div
            id="eventCarousel"
            class="carousel slide pointer-event"
            data-bs-ride="carousel"
            style="min-height: 684px"
          >
            <div id="event-list" class="carousel-inner"></div>
            <!-- Controles do Carrossel -->
            <button
              class="carousel-control-prev"
              type="button"
              data-bs-target="#eventCarousel"
              data-bs-slide="prev"
            >
              <span
                class="carousel-control-prev-icon"
                aria-hidden="true"
              ></span>
              <span class="visually-hidden">Anterior</span>
            </button>
            <button
              class="carousel-control-next"
              type="button"
              data-bs-target="#eventCarousel"
              data-bs-slide="next"
            >
              <span
                class="carousel-control-next-icon"
                aria-hidden="true"
              ></span>
              <span class="visually-hidden">Próximo</span>
            </button>
          </div>
        </div>
      </div>
    </div>
    <main>
      <!-- Seção Notícias -->
      <section
        class="container h-100 d-flex flex-column align-items-start justify-content-center"
      >
        <h1 class="text-dark fw-bold mb-4">Notícias</h1>
        <div id="new-list" class="row"></div>
      </section>

      <!-- Seção Loja -->
      <section class="store h-100 d-flex align-items-center">
        <div class="container">
          <div
            class="d-flex justify-content-center align-items-start h-100 flex-column"
          >
            <!-- cabeçalho da seção loja -->
            <header
              class="d-flex justify-content-between align-items-center w-100 mt-4"
            >
              <h1 class="my-5 text-dark fw-bold text-center">LOJA</h1>

              <button
                class="p-1 border border-4 border-dark rounded-3 position-relative mx-2"
              >
                <img
                  src="dist/assets/icons/cart.svg"
                  alt="carrinho de compras"
                  class="cart"
                />
                <span
                  class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                >
                  99+
                  <span class="visually-hidden">unread messages</span>
                </span>
              </button>
            </header>

            <div
              id="storeCarousel"
              class="carousel slide w-100"
              data-bs-ride="carousel"
            >
              <div id="product-list" class="carousel-inner p-5"></div>
              <button
                class="carousel-control-prev"
                type="button"
                data-bs-target="#storeCarousel"
                data-bs-slide="prev"
              >
                <span
                  class="carousel-control-prev-icon"
                  aria-hidden="true"
                ></span>
                <span class="visually-hidden">Anterior</span>
              </button>
              <button
                class="carousel-control-next"
                type="button"
                data-bs-target="#storeCarousel"
                data-bs-slide="next"
              >
                <span
                  class="carousel-control-next-icon"
                  aria-hidden="true"
                ></span>
                <span class="visually-hidden">Próximo</span>
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Rodapé -->
    <footer class="py-4 text-center">
      <div class="d-flex justify-content-center mb-3">
        <a href="#" class="mx-2">
          <img
            src="./dist/assets/icons/facebook-footer.svg"
            alt="Facebook Icon"
          />
        </a>
        <a href="#" class="mx-2">
          <img
            src="./dist/assets/icons/headphones-footer.svg"
            alt="Headphones Icon"
          />
        </a>
        <a href="#" class="mx-2">
          <img
            src="./dist/assets/icons/instagram-footer.svg"
            alt="Instagram Icon"
          />
        </a>
        <a href="#" class="mx-2">
          <img
            src="./dist/assets/icons/youtube-footer.svg"
            alt="YouTube Icon"
          />
        </a>
      </div>
      <p>Fourminds Tech ©</p>
    </footer>
    <script src="/bootstrap/js/bootstrap.bundle.js"></script>
    <script src="/dist/js/home/index.js"></script>
  </body>
</html>
