<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sanity Destroyed</title>
    <link rel="stylesheet" href="/dist/css/styles.css" />
    <link
      rel="shortcut icon"
      href="/dist/assets/images/logo.ico"
      type="image/x-icon"
    />
  </head>
  <body>
    <header class="background-header p-3 background">
      <nav class="container">
        <!-- Navegação para Dispositivos Grandes -->
        <div class="d-none d-lg-flex justify-content-around align-items-center">
          <a class="link" href="/agenda">Agenda</a>
          <a class="link" href="/banda">Banda</a>
          <a class="link active" href="/musicas">Músicas</a>
          <a href="/">
            <img src="/dist/assets/images/logo.png" alt="logo" />
          </a>
          <a class="link" href="/novidades">Novidades</a>
          <a class="link" href="/midias">Mídias</a>
          <a class="link" href="/loja">Loja</a>
        </div>

        <!-- Ícone do menu como Dropdown (Móvel) -->
        <div class="d-lg-none position-relative">
          <!-- Logo Centralizada (Móvel) -->
          <div class="text-center mb-3">
            <a href="/">
              <img
                src="/dist/assets/images/logo.png"
                alt="logo"
                class="img-fluid w-25"
              />
            </a>
          </div>

          <!-- Botão Dropdown -->
          <div class="dropdown position-absolute top-0 end-0 m-3">
            <button
              class="btn border-0"
              type="button"
              id="dropdownMenuButton"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              <img
                class="img-fluid dropdown-icon"
                style="width: 2rem"
                src="/dist/assets/icons/menu.svg"
                alt="menu"
              />
            </button>
            <ul
              class="dropdown-menu text-center"
              aria-labelledby="dropdownMenuButton"
            >
              <li>
                <a class="dropdown-item" href="/agenda">Agenda</a>
              </li>
              <li><a class="dropdown-item" href="/banda">Banda</a></li>
              <li><a class="dropdown-item" href="/musicas">Músicas</a></li>
              <li><a class="dropdown-item" href="/novidades">Novidades</a></li>
              <li><a class="dropdown-item" href="/midias">Mídias</a></li>
              <li><a class="dropdown-item" href="/loja">Loja</a></li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="main-container">
      <div class="play-list">
        <h1>Albuns</h1>
        <select name="Albuns" id="albuns">
          <option value="Sanity Destroyed">Sanity Destroyed</option>
        </select>
        <ul class="music-list list-unstyled"></ul>
      </div>

      <div class="container-play">
        <div class="music-play">
          <div class="container-display">
            <div class="content-img">
              <img
                src="/dist/assets/images/capa-album.png"
                style="width: 16rem"
                alt="capa-album"
              />
            </div>
            <div class="container-controls">
              <div class="container-info">
                <div class="fw-bold my-3">
                  <p class="text-light fs-2" id="music-name"></p>
                  <p class="text-primary fs-5" id="album-name"></p>
                </div>
                <div class="control">
                  <img
                    class="img-fluid"
                    src="/dist/assets/icons/player-left.svg"
                    alt="prev"
                  />
                  <img
                    class="img-fluid"
                    src="/dist/assets/icons/play.svg"
                    alt="play"
                  />
                  <img
                    class="img-fluid d-none"
                    src="/dist/assets/icons/pause.svg"
                    alt="pause"
                  />
                  <img
                    class="img-fluid"
                    src="/dist/assets/icons/player-right.svg"
                    alt="next"
                  />
                </div>
              </div>
              <div class="volume-control">
                <input
                  type="range"
                  id="volume-slider"
                  min="0"
                  max="100"
                  value="100"
                />
              </div>
            </div>
          </div>
          <div class="progress-container">
            <span class="current-time"></span>
            <div class="progress-bar">
              <div class="progress"></div>
            </div>
            <span class="total-time"></span>
          </div>
          <div class="play-list-mobile">
            <h1>Albuns</h1>
            <select name="Albuns" id="albuns">
              <option value="Sanity Destroyed">Sanity Destroyed</option>
            </select>
            <ul class="music-list list-unstyled"></ul>
          </div>
        </div>

        <div class="streamer">
          <ul class="list-unstyled">
            <li>
              <a
                href="https://spotify.com"
                class="text-decoration-none text-dark text-center"
              >
                <img src="/dist/assets/icons/spotify-icon.svg" alt="Spotify" />
                <p>Spotify</p>
              </a>
            </li>
            <li>
              <a href="https://deezer.com">
                <img src="/dist/assets/icons/deezer-icon.svg" alt="Deezer" />
                <p>Deezer</p>
              </a>
            </li>
            <li>
              <a href="https://youtube.com">
                <img src="/dist/assets/icons/youtube-icon.svg" alt="YouTube" />
                <p>YouTube</p>
              </a>
            </li>
            <li>
              <a href="https://apple.com/music">
                <img
                  src="/dist/assets/icons/applemusic-icon.svg"
                  alt="Apple Music"
                />
                <p>Apple Music</p>
              </a>
            </li>
            <li>
              <a href="https://qobuz.com">
                <img src="/dist/assets/icons/qobuz-icon.svg" alt="Qobuz" />
                <p>Qobuz</p>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div>
        <a href="">
          <img src="/dist/assets/icons/facebook-footer.svg" alt="" />
        </a>
        <a href="">
          <img src="/dist/assets/icons/headphones-footer.svg" alt="" />
        </a>
        <a href="">
          <img src="/dist/assets/icons/instagram-footer.svg" alt="" />
        </a>
        <a href="">
          <img src="/dist/assets/icons/youtube-footer.svg" alt="" />
        </a>
      </div>
      <p>Fourminds Tech ©</p>
    </footer>

    <script src="/bootstrap/js/bootstrap.bundle.js"></script>
    <script src="/dist/js/musicPlayer.js"></script>
  </body>
</html>
